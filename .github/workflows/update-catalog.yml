name: Update Static Add-on Catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build catalog
        run: python scripts/build_catalog.py --out-dir data
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json.gz
          if ! git diff --cached --quiet; then
            git commit -m "chore(catalog): daily AnkiWeb add-on index refresh"
            git push
          fi
